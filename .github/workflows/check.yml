name: make check
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare build directory
        run: mkdir -p bin
      - name: make check
        run: |
          set -o pipefail
          make check | tee /tmp/make-check.log
          {
            echo '## make check — passed'
            echo '```text'
            cat /tmp/make-check.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
